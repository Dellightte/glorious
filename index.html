<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pillar &amp; Glorious</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Mulish:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ═══ WARM LIGHT ═══ 2026 direction 2 */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FBF1E7; --bg-2:#F6E6D6; --card:#FFFBF6;
  --ink:#2A1A12; --ink-soft:#6B5446;
  --peach:#F2A074; --peach-lt:#FBC9A6; --peach-dp:#D87E54; --peach-wash:#FCE4D2;
  --gold:#C9A84C; --plum:#1A0E0A;
  --disp:'Fraunces',Georgia,serif;
  --body:'Mulish',-apple-system,system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6}

.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:210;background:linear-gradient(90deg,var(--peach-lt),var(--peach),var(--peach-dp))}
.dot-nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:150;display:flex;flex-direction:column;gap:12px}
.dot-nav a{width:8px;height:8px;border-radius:50%;background:rgba(216,126,84,.3);transition:.3s}
.dot-nav a.on{background:var(--peach-dp);transform:scale(1.4)}
@media(max-width:680px){.dot-nav{display:none}}

.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.sec{position:relative;padding:clamp(90px,14vw,170px) 0}
.kicker{font-family:var(--body);font-weight:800;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--peach-dp);display:flex;align-items:center;gap:14px;margin-bottom:26px}
.kicker .num{font-family:var(--disp);font-weight:300;font-style:italic;font-size:1.3rem;letter-spacing:0;color:var(--peach)}
.heading{font-family:var(--disp);font-weight:340;font-size:clamp(2.4rem,7.5vw,4.6rem);line-height:1.02;letter-spacing:-.02em}
.heading em{font-style:italic;font-weight:340;color:var(--peach-dp)}
.lede{font-size:clamp(1.05rem,3vw,1.25rem);color:var(--ink-soft);max-width:46ch;margin-top:22px;line-height:1.7}

.r{opacity:0;transform:translateY(30px);transition:opacity 1.1s cubic-bezier(.2,.6,.2,1),transform 1.1s cubic-bezier(.2,.6,.2,1)}
.r.in{opacity:1;transform:none}
.rl{display:block;opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease}
.rl.in{opacity:1;transform:none}

/* HERO */
#hero{min-height:100svh;display:flex;align-items:center;position:relative;overflow:hidden}
.h-cover{position:absolute;inset:0;z-index:0;overflow:hidden}
.h-cover img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.mesh{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(46% 50% at 18% 26%,var(--peach-wash) 0%,transparent 60%),
    radial-gradient(40% 44% at 84% 22%,rgba(251,201,166,.6) 0%,transparent 58%),
    radial-gradient(54% 56% at 72% 88%,rgba(242,160,116,.32) 0%,transparent 60%),
    radial-gradient(40% 40% at 10% 90%,rgba(201,168,76,.2) 0%,transparent 60%)}
.mesh::after{content:'';position:absolute;width:60vmax;height:60vmax;left:60%;top:30%;border-radius:50%;
  background:radial-gradient(circle,rgba(242,160,116,.22),transparent 60%);filter:blur(20px);
  animation:breathe 9s ease-in-out infinite}
.h-inner{position:relative;z-index:1}
.h-eyebrow{font-family:var(--body);font-weight:800;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--peach-dp);margin-bottom:28px;opacity:0;animation:fin 1s ease .2s forwards}
.h-title{font-family:var(--disp);line-height:.9;letter-spacing:-.03em}
.h-pre{display:block;font-weight:300;font-size:clamp(2.2rem,9vw,5rem);color:var(--ink);opacity:0;animation:fup 1.1s ease .4s forwards}
.h-name{display:block;font-weight:300;font-style:italic;font-size:clamp(4rem,22vw,13rem);letter-spacing:-.04em;
  color:var(--ink);
  opacity:0;animation:fup 1.2s ease .65s forwards}
.h-tag{margin-top:34px;max-width:32ch;font-family:var(--disp);font-style:italic;font-weight:340;
  font-size:clamp(1.15rem,4vw,1.7rem);line-height:1.55;color:var(--ink-soft);opacity:0;animation:fin 1.1s ease 1.1s forwards}
.h-cue{position:absolute;left:24px;bottom:32px;z-index:1;font-family:var(--body);font-weight:700;font-size:.62rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--peach-dp);display:flex;align-items:center;gap:12px;opacity:0;animation:fin 1s ease 1.7s forwards}
.h-cue .bar{width:50px;height:1px;background:linear-gradient(90deg,var(--peach-dp),transparent);transform-origin:left;animation:scan 2.2s ease-in-out infinite}

/* video */
.video{position:relative;width:100%;aspect-ratio:16/9;background:var(--peach-wash);overflow:hidden;border-radius:18px;
  box-shadow:0 30px 60px -30px rgba(216,126,84,.5);margin-top:8px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(140deg,var(--peach-wash),var(--bg-2))}
.vph .ring{width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(216,126,84,.6)}
.vph .ring::after{content:'';border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:16px solid var(--peach-dp);margin-left:4px}
.vph p{font-weight:700;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--peach-dp)}

/* FROM ME — poem on soft card */
.from-grid{display:grid;grid-template-columns:1fr;gap:48px;margin-top:46px}
.poem{font-family:var(--disp);font-weight:340;font-size:clamp(1.4rem,4.6vw,2.1rem);line-height:1.5;letter-spacing:-.01em;color:var(--ink)}
.poem .rl{display:block}

/* BENTO — masonry, photos keep natural shape */
.bento{columns:2;column-gap:16px;margin-top:44px}
.cell{break-inside:avoid;margin-bottom:16px;position:relative;overflow:hidden;border-radius:18px;
  box-shadow:0 20px 40px -28px rgba(216,126,84,.45);display:block;
  background:linear-gradient(135deg,var(--peach-wash),var(--bg-2))}
.cell img{width:100%;height:auto;display:block}
.cell .grad{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top,rgba(10,5,2,.78) 0%,rgba(10,5,2,.15) 60%,transparent 100%);z-index:0;pointer-events:none}
.cell .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;font-family:var(--disp);font-style:italic;font-size:.95rem;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.85),0 2px 20px rgba(0,0,0,.5);line-height:1.35}
.cell.placeholder{min-height:280px;display:flex;align-items:flex-end;padding:18px}
.cell .tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--peach-dp);opacity:.7}
.cell.placeholder .cap{position:relative;left:0;right:0;bottom:0;color:var(--ink);text-shadow:none}
.story-video{margin-top:16px;width:100%;max-width:420px;margin-left:auto;margin-right:auto;aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;
  box-shadow:0 20px 40px -28px rgba(216,126,84,.45);background:linear-gradient(140deg,var(--peach-wash),var(--bg-2))}
.story-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* AFFIRMATIONS — cards */
.aff-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:44px}
.aff{background:var(--card);border-radius:20px;padding:clamp(26px,5vw,40px);box-shadow:0 24px 50px -34px rgba(216,126,84,.5);
  border:1px solid rgba(216,126,84,.1)}
.aff .ix{font-family:var(--disp);font-style:italic;font-weight:300;font-size:1.4rem;color:var(--peach);margin-bottom:10px}
.aff h3{font-family:var(--disp);font-weight:380;font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.08;letter-spacing:-.01em;margin-bottom:14px}
.aff p{font-size:clamp(1rem,3vw,1.08rem);line-height:1.72;color:var(--ink-soft);max-width:64ch}

/* DARK SHIFT — prayers + close */
.dark{background:var(--plum);color:#F6E6D6;position:relative;overflow:hidden}
.dark .mesh-d{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(50% 40% at 30% 16%,rgba(242,160,116,.16),transparent 60%),radial-gradient(46% 40% at 82% 84%,rgba(201,168,76,.12),transparent 60%)}
.dark .wrap{position:relative;z-index:1}
.dark .kicker{color:var(--peach-lt)}
.dark .kicker .num{color:var(--peach)}
.dark .heading em{color:var(--peach-lt)}
.pray{padding:44px 0;border-top:1px solid rgba(246,230,214,.12)}
.pray:first-of-type{border-top:0;padding-top:46px}
.pray .ref{font-weight:800;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.9;margin-bottom:12px}
.pray h3{font-family:var(--disp);font-weight:360;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.08;margin-bottom:14px;color:#FBF1E7}
.pray h3 .e{font-style:italic;color:var(--peach-lt)}
.pray p{font-size:clamp(1rem,3vw,1.08rem);line-height:1.74;color:rgba(246,230,214,.66);max-width:62ch}

/* VOICES */
.comp-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:44px 0 16px}
.comp-label{font-weight:800;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--peach-dp)}
.comp-title{font-family:var(--disp);font-style:italic;font-weight:340;font-size:clamp(1.4rem,5vw,2rem);color:var(--ink)}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.vcard{background:var(--card);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;min-height:150px;
  box-shadow:0 20px 40px -30px rgba(216,126,84,.5);border:1px solid rgba(216,126,84,.1)}
.vcard .av{width:50px;height:50px;border-radius:50%;background:linear-gradient(140deg,var(--peach-lt),var(--peach-dp));
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:1.4rem;color:#fff;box-shadow:0 10px 22px -8px rgba(216,126,84,.7)}
.vcard .vn{font-family:var(--disp);font-weight:360;font-size:1.3rem;line-height:1.1}
.vcard .vnote{font-weight:700;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--peach-dp);margin-top:auto}
.vcard audio{width:100%}

/* MOMENTS */
.acc{margin-top:40px;border-top:1px solid rgba(216,126,84,.18)}
.acc-item{border-bottom:1px solid rgba(216,126,84,.18)}
.acc-trig{width:100%;background:none;border:0;cursor:pointer;text-align:left;color:inherit;display:flex;align-items:center;gap:18px;padding:26px 0}
.acc-trig .ai{font-family:var(--disp);font-style:italic;font-weight:300;font-size:1.3rem;color:var(--peach);flex:0 0 auto}
.acc-trig .al{font-family:var(--disp);font-weight:340;font-size:clamp(1.2rem,4.4vw,1.8rem);line-height:1.12;flex:1}
.acc-trig .pl{flex:0 0 auto;width:22px;height:22px;position:relative}
.acc-trig .pl::before,.acc-trig .pl::after{content:'';position:absolute;left:50%;top:50%;background:var(--peach-dp);transition:.35s}
.acc-trig .pl::before{width:15px;height:1.6px;transform:translate(-50%,-50%)}
.acc-trig .pl::after{width:1.6px;height:15px;transform:translate(-50%,-50%)}
.acc-item.open .pl::after{transform:translate(-50%,-50%) rotate(90deg);opacity:0}
.acc-body{max-height:0;overflow:hidden;transition:max-height .55s cubic-bezier(.4,0,.2,1)}
.acc-item.open .acc-body{max-height:640px}
.acc-inner{padding:0 0 30px 42px;max-width:62ch}
.acc-inner .ref{font-weight:800;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.acc-inner p{font-size:clamp(1rem,3vw,1.08rem);line-height:1.74;color:var(--ink-soft)}

/* CLOSE */
#close{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:clamp(110px,16vw,190px);padding-bottom:clamp(110px,16vw,190px)}
.c-poem{font-family:var(--disp);font-weight:340;font-size:clamp(1.5rem,5.2vw,2.4rem);line-height:1.62;max-width:24ch;margin-bottom:52px;color:#FBF1E7}
.c-div{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--peach),transparent);margin-bottom:52px}
.c-final{font-family:var(--disp);font-style:italic;font-weight:300;font-size:clamp(2.2rem,9vw,4.6rem);line-height:1.18;padding-bottom:.12em;
  background:linear-gradient(100deg,var(--peach-lt),var(--peach) 50%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--peach-lt)}

.back{position:fixed;left:18px;bottom:18px;z-index:160;font-family:var(--body);font-weight:800;font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;background:var(--peach-dp);padding:10px 16px;border-radius:40px;text-decoration:none;box-shadow:0 12px 28px -10px rgba(216,126,84,.8)}

@keyframes fin{to{opacity:1}}
@keyframes fup{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes scan{0%,100%{transform:scaleX(.4);opacity:.5}50%{transform:scaleX(1);opacity:1}}
@keyframes breathe{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-30px,20px) scale(1.1);opacity:1}}

@media(max-width:680px){.voices{grid-template-columns:1fr}.bento{columns:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.r,.rl{opacity:1!important;transform:none!important}}

</style>
</head>
<body>
<div class="progress"></div>
<nav class="dot-nav"></nav>
<main id="app"></main>

<script>
/* ════════════════════════════════════════════════════════════

window.PG = {

  hero: {
    cover: "photos/cover-glorious.jpg",   // ← cover image path; set "" to remove
    eyebrow: "a birthday gift",
    pre: "Pillar &",
    name: "Glorious",
    tagline: ["you were steady by me,", "and there was already you before us."]
  },

  fromMe: {
    n: "01",
    label: "From Me to You",
    heading: "For your eyes only.",
    videoNote: "A message from Bolu",
    videoId: "K0rYcEX1aCk",   // ← YouTube unlisted ID goes here
    poem: [
      "It began on an empty street,",
      "in a lockdown that redefined our focus,",
      "an online working spree",
      "with a group of writers",
      "and you at its helm,",
      "holding it all together —",
      "then a bus window,",
      "a beautiful sunset,",
      "glistening sea waves",
      "rocking like a gleeful youth",
      "about to break a secret",
      "that nature must have known,",
      "for it was a one-way trip,",
      "the kind you only return from",
      "with exchanged hearts,",
      "an Ibeju kind of trip",
      "with a part of our class,",
      "where your trip-tired face",
      "made it all the more beautiful,",
      "and somewhere in it all,",
      "a time before then, I knew it could be you,",
      "a point at that time, I knew it was you,",
      "a little time after, I told you it was you,",
      "having said I love you —",
      "words you will hear me say",
      "from now, forevermore,",
      "even as you keep on growing,",
      "like a widening stream",
      "that makes everything beautiful in its path."
    ]
  },

  story: {
    n: "02",
    label: "Our Story",
    heading: "The moments that made us.",
    // ← Bolu: set `src` to your photo path. Photos display at their natural shape — no cropping.
    photos: [
      { src: "photos/photo-1-friends.jpg", caption: "Ife — just best friends, before anything else." },
      { src: "photos/photo-2-ibeju.jpg", caption: "Ibeju-Lekki — somewhere between what we were and what we'd become." },
      { src: "photos/photo-3-ilesa-start.jpg", caption: "Ilesa in — when we came in as lovers." },
      { src: "photos/photo-4-ilesa-end.jpg", caption: "Ilesa out — and we left still in love." }
    ],
    videoNote: "A clip from our story",
    videoId: "6VhsNGmL_go"    // ← YouTube unlisted ID
  },

  affirmations: {
    n: "03",
    label: "Who You Are",
    heading: "Things I need you to know.",
    items: [
      { title: "You are a builder of people.",
        body: "Before you were mine, you were already doing what you were made for — holding people together, keeping things moving, being the link that stops everything from falling apart. You did it for a writing agency. You did it for a study group. You have done it without even trying. The world needs people who know how to make other people work better together — and you are one of them." },
      { title: "Your frustration is not a stop sign.",
        body: "You feel it when something doesn't come right immediately — that quiet panic that says maybe you weren't built for this. But frustration isn't failure. It is the feeling of growth happening in real time. The people who have changed things were not the ones who never struggled — they were the ones who stayed when it got hard. You are capable of far more than you let yourself believe." },
      { title: "Your mind is one of a kind.",
        body: "There is something about the way you reason — the way you turn a problem over and find the angle no one else saw — that is different. I have walked away from conversations with you sharper than I came in. I do not take your opinions lightly, and neither should you. Don't let anyone — including yourself — convince you that your intelligence is ordinary. It is not." },
      { title: "You are led, and you are covered.",
        body: "You will sometimes take a road no one else would choose. Pay attention to God — He is always speaking, always a step ahead of where you are, and He will not lead you astray. And if you ever need my direction too, I am always ready to give it. I am not here to obstruct your steps. Just a safety net, always within reach." },
      { title: "You are more loved than you know.",
        body: "When something goes wrong, it is rarely because people think unkindly of you. You are not someone people find reasons to dislike — you are someone people find reasons to stay for. Not everyone has the words, but you are loved. Deeply, quietly, consistently. Be at peace with yourself — imperfection is just being human, but we are on a journey of perfection with the Holy Spirit, and you are wonderfully walking it." },
      { title: "There is a version of you the church hasn't fully seen yet.",
        body: "What you carry — the way you lead, the way you hold people, the way you show up — is not just for boardrooms and classrooms. If you let God move freely with you, there is a version of you that will change rooms you haven't even walked into yet. I believe that. I am waiting to watch it happen." },
      { title: "I love you. Fully.",
        body: "Not despite who you are — because of who you are. The strength, the stubbornness, the growth, the frustration, the brilliance, the softness. All of it. I always will." }
    ]
  },

  prayers: {
    n: "04",
    label: "Prayers Over You",
    heading: "Words spoken on your behalf.",
    items: [
      { ref: "Habakkuk 2:1 · 1 Timothy 4:12", title: "God Is Setting You On Your Watch",
        body: "God is setting you on your watch. He is placing you in a position of alertness, of faithfulness, of readiness. You will exemplify faith — not just in word, but in how you live, how you lead, how you love. People will look at your life and know what it means to believe." },
      { ref: "Psalm 91:16", title: "With Long Life, He Will Satisfy You",
        body: "With long life, God will satisfy you. Not years that are merely counted, but years that are full — full of meaning, full of growth, full of Him. He will show you His salvation through every season. You will see the goodness of the Lord all the days of your life." },
      { ref: "Psalm 36:8", title: "You Will Eat From His Stores",
        body: "You will eat well from God's pleasurable stores — forevermore. What He has set aside for you is not scarce. It is a feast prepared by His own hands, and it never runs out. You will drink from the river of His delights, and you will never go without." },
      { ref: "Hebrews 10:23 · Romans 4:18", title: "Your Hope Will Hold",
        body: "You will never lose hope in the promises of God in your life. When delay comes, your hope will hold. When disappointment tries to settle, faith will rise in you. Like Abraham, who hoped against all hope and still believed — you will hold fast. He who promised is faithful, and His word over your life will not return void." },
      { ref: "Hebrews 11:1 · Jeremiah 29:11 · Psalm 139:16", title: "Your World Is Curated By His Hands",
        body: "By faith, your world is perfectly curated and formed to fulfill God's purposes — not just for this season, but for many generations to come. Every detail of your life is accounted for. Every step has been written. What He is building through you is bigger than you can see right now, and it will outlast you." },
      { ref: "Jeremiah 31:3 · 1 John 4:18 · 2 Timothy 1:7", title: "You Are Held In Everlasting Love",
        body: "God loves you with an everlasting love — the kind that does not waver, does not expire, does not depend on what you have or haven't done. He showers you with His lovely embrace, and in that love, doubt and fear have no hold in your life. He has not given you a spirit of fear. Walk free." },
      { ref: "Zechariah 3:2 · Psalm 16:8 · Romans 10:11", title: "You Will Not Be Put To Shame",
        body: "I rebuke Satan, the accuser, over your life — in the name of Jesus. Every word spoken against you is silenced by the word of God. God is at your right hand, and because He is there, you will not be shaken. You will never be put to shame. The accuser has no authority over what God has covered." },
      { ref: "Isaiah 26:3 · Matthew 6:33", title: "You Will Walk In Perfect Peace",
        body: "God will keep your soul in perfect peace — peace that is not moved by what you see or what you feel. He will hold first place in your heart, every day, for the rest of your life. Your desire will be for Him above all else, and as you walk with Him, everything you need will follow you. From the first thought of your morning to the last surrender of your night, He will be your portion." }
    ]
  },

  voices: {
    n: "05",
    label: "Voices of Love",
    heading: "From everyone who loves you.",
    // ← Bolu: the friends' greeting video compilation goes here. Set videoId to the YouTube unlisted ID.
    compilation: {
      title: "Everyone Who Loves You",
      note: "A video compilation of friends & family greeting you",
      videoId: "2O6rlq5U4OE"
    },
    // ← Bolu: set name + initial, and either videoId (YouTube) or audio (path to .mp3)
    cards: [
      { name: "Your Dad", initial: "D", note: "Her Dad — add audio", videoId: "", audio: "audio/audio-her-dad.m4a" },
      { name: "Your Mum", initial: "M", note: "Her Mum — add audio", videoId: "", audio: "audio/audio-mum.m4a" },
      { name: "Janet", initial: "J", note: "A word from Janet", videoId: "", audio: "audio/audio-janet.m4a" },
      { name: "Bolu's Dad", initial: "D", note: "A word from Dad", videoId: "", audio: "audio/audio-dad.m4a" },
      { name: "Bolu's Sister", initial: "S", note: "A word from Bolu's sister", videoId: "", audio: "audio/audio-bolu-sister.m4a" },
      { name: "Bolu's Mum", initial: "M", note: "A word from Bolu's mum", videoId: "", audio: "audio/audio-bolu-mum.m4a" }
    ]
  },

  moments: {
    n: "06",
    label: "For Every Moment",
    heading: "Open when you need it.",
    items: [
      { label: "When you doubt yourself",
        ref: "Philippians 4:13 · Isaiah 41:10 · Psalm 139:14",
        text: "The voice in your head right now is lying to you — not gently, but loudly and convincingly, the way lies always sound when they know you well. God says you are fearfully and wonderfully made, and He does not make mistakes. You are not too small for whatever is standing in front of you. I have watched you reason through things that would leave most people lost. I have seen your mind work in rooms where it was the sharpest thing there. You can do all things through Christ who strengthens you. Breathe. Start again." },
      { label: "When you're frustrated and want to quit",
        ref: "Galatians 6:9 · James 1:3-4 · Isaiah 40:31",
        text: "Don't. Not yet. The frustration you're feeling right now is not a sign you were wrong to begin — it's proof you care enough to get it right. The testing of your faith is producing perseverance; let that perseverance finish its work. Those who wait on the Lord will renew their strength. You are closer than you think. Stay." },
      { label: "When you feel unloved or misunderstood",
        ref: "Zephaniah 3:17 · Romans 8:38-39 · 1 John 4:19",
        text: "I know what you're feeling — like the room is tilted against you, like something went wrong and somehow it's because of how people see you. But God Himself takes great delight in you and rejoices over you with singing. Nothing in all creation can separate you from His love — or from mine. You are not someone people find reasons to dislike. You are someone people find reasons to stay for. You are loved. More than you know." },
      { label: "When you're afraid",
        ref: "2 Timothy 1:7 · 1 John 4:18 · Isaiah 41:10",
        text: "Fear is loud but it is not in charge. God has not given you a spirit of fear, but of power, of love, and of a sound mind. Perfect love casts out fear — and you are held in that perfect love. What you're facing right now does not have the final word over your life. He has said you will not be put to shame. Hold those words tighter than what you feel. The feeling will pass. His word won't." },
      { label: "When you're proud of yourself",
        ref: "Zephaniah 3:17 · Colossians 3:23 · Philippians 4:13",
        text: "Good. Stay there. You worked with all your heart, and God sees that — He rejoices over you even now. Don't shrink it, don't explain it, don't rush past it. You stayed when it was hard, you showed up when it was inconvenient, and you did it through Christ who strengthened you. Let yourself feel every bit of this moment without apology. You deserve it. I am proud of you too." },
      { label: "When you miss me",
        ref: "Ecclesiastes 4:9-10 · Song of Solomon 3:4",
        text: "I'm here. Not just in the way that phrase gets thrown around — I mean I am genuinely, deliberately here. Two are better than one, and if either falls, the other is there to help them up. Whatever distance or silence made you open this, nothing about how I feel has changed. You are still the first person I want to call. You are still the one who makes everything make sense. I found the one my heart loves, and I'm not letting go. We're okay." }
    ]
  },

  close: {
    label: "For You, Always",
    poem: [
      "I could lean on you",
      "and know the ground would hold.",
      "I could laugh with you",
      "and mean every breath of it.",
      "We are best of friends —",
      "and I can't wait",
      "to build our lives as one."
    ],
    final: "Live Long, My Jewel."
  }
};

</script>
<script>
/* ═══ WARM LIGHT — render + motion ═══ */
(function(){
  const D = window.PG;
  const root = document.getElementById('app');
  const sec = (id,cls,inner)=>{const s=document.createElement('section');s.className='sec'+(cls?' '+cls:'');if(id)s.id=id;
    s.innerHTML = id==='hero'||cls&&cls.includes('dark')&&false?inner:`<div class="wrap">${inner}</div>`;return s;};
  function video(id,note){
    if(id) return `<div class="video"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`;
    return `<div class="video"><div class="vph"><div class="ring"></div><p>${note}</p></div></div>`;
  }

  /* HERO */
  const hero=document.createElement('section');hero.className='sec';hero.id='hero';
  hero.innerHTML=`${D.hero.cover?`<div class="h-cover"><img src="${D.hero.cover}" alt=""></div>`:''}<div class="mesh"></div>
    <div class="wrap"><div class="h-inner">
      <div class="h-eyebrow">${D.hero.eyebrow}</div>
      <h1 class="h-title"><span class="h-pre">${D.hero.pre}</span><span class="h-name">${D.hero.name}</span></h1>
      <p class="h-tag">${D.hero.tagline.join('<br>')}</p>
    </div></div>
    <div class="h-cue"><span class="bar"></span>scroll</div>`;
  root.appendChild(hero);

  /* FROM ME */
  root.appendChild(sec(null,null,
    `<div class="kicker"><span class="num">${D.fromMe.n}</span><span>${D.fromMe.label}</span></div>
     <h2 class="heading r">For your <em>eyes</em> only.</h2>
     <p class="lede r">${D.fromMe.videoNote} — and the words that began it all.</p>
     <div class="from-grid">
       <div class="r">${video(D.fromMe.videoId,D.fromMe.videoNote)}</div>
       <div class="poem">${D.fromMe.poem.map((l,i)=>`<span class="rl" style="transition-delay:${Math.min(i*35,560)}ms">${l}</span>`).join('')}</div>
     </div>`));

  /* STORY masonry */
  const cells=D.story.photos.map((p,i)=>{
    const inner=p.src?`<img src="${p.src}" alt="" loading="lazy"><div class="grad"></div><span class="cap">${p.caption}</span>`:`<span class="tag">add photo</span><span class="cap">${p.caption}</span>`;
    return `<div class="cell r${p.src?'':' placeholder'}">${inner}</div>`;}).join('');
  const storyVid=D.story.videoId?`<div class="story-video r"><iframe src="https://www.youtube.com/embed/${D.story.videoId}" allowfullscreen></iframe></div>`:`<div class="story-video r"><div class="vph"><div class="ring"></div><p>${D.story.videoNote}</p></div></div>`;
  root.appendChild(sec(null,null,
    `<div class="kicker"><span class="num">${D.story.n}</span><span>${D.story.label}</span></div>
     <h2 class="heading r">The moments that <em>made us</em>.</h2>
     <div class="bento">${cells}</div>
     ${storyVid}`));

  /* AFFIRMATIONS */
  root.appendChild(sec(null,null,
    `<div class="kicker"><span class="num">${D.affirmations.n}</span><span>${D.affirmations.label}</span></div>
     <h2 class="heading r">Things I need you to <em>know</em>.</h2>
     <div class="aff-grid">${D.affirmations.items.map((a,i)=>`<div class="aff r"><div class="ix">${String(i+1).padStart(2,'0')}</div><h3>${a.title}</h3><p>${a.body}</p></div>`).join('')}</div>`));

  /* PRAYERS — dark shift */
  const pray=sec(null,'dark',
    `<div class="kicker"><span class="num">${D.prayers.n}</span><span>${D.prayers.label}</span></div>
     <h2 class="heading r">Words spoken on your <em>behalf</em>.</h2>
     ${D.prayers.items.map(p=>`<div class="pray r"><div class="ref">${p.ref}</div><h3>${p.title}</h3><p>${p.body}</p></div>`).join('')}`);
  pray.insertAdjacentHTML('afterbegin','<div class="mesh-d"></div>');
  root.appendChild(pray);

  /* VOICES */
  const comp=D.voices.compilation;
  const compMedia=comp.videoId?`<iframe style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:18px" src="https://www.youtube.com/embed/${comp.videoId}" allowfullscreen></iframe>`:`<div class="vph"><div class="ring"></div><p>${comp.note}</p></div>`;
  root.appendChild(sec(null,null,
    `<div class="kicker"><span class="num">${D.voices.n}</span><span>${D.voices.label}</span></div>
     <h2 class="heading r">From everyone who <em>loves you</em>.</h2>
     <div class="comp-head r"><span class="comp-label">The Compilation</span><span class="comp-title">${comp.title}</span></div>
     <div class="story-video r" style="margin-top:20px">${compMedia}</div>
     <div class="voices">${D.voices.cards.map(c=>{
        let media=c.videoId?`<div class="video"><iframe src="https://www.youtube.com/embed/${c.videoId}" allowfullscreen></iframe></div>`:c.audio?`<audio controls style="width:100%;margin-top:10px;border-radius:8px"><source src="${c.audio}" type="audio/mp4">Your browser does not support audio playback.</audio>`:`<div class="vnote">${c.note}</div>`;
        return `<div class="vcard r"><div class="av">${c.initial}</div><div class="vn">${c.name}</div>${media}</div>`;}).join('')}</div>`));

  /* MOMENTS */
  root.appendChild(sec(null,null,
    `<div class="kicker"><span class="num">${D.moments.n}</span><span>${D.moments.label}</span></div>
     <h2 class="heading r">Open when you <em>need it</em>.</h2>
     <div class="acc r">${D.moments.items.map((m,i)=>`
       <div class="acc-item"><button class="acc-trig" aria-expanded="false"><span class="ai">${String(i+1).padStart(2,'0')}</span><span class="al">${m.label}</span><span class="pl"></span></button>
       <div class="acc-body"><div class="acc-inner"><div class="ref">${m.ref}</div><p>${m.text}</p></div></div></div>`).join('')}</div>`));

  /* CLOSE — dark */
  const close=sec('close','dark',
    `<div class="kicker" style="justify-content:center">${D.close.label}</div>
     <div class="c-poem">${D.close.poem.map((l,i)=>`<span class="rl" style="transition-delay:${i*70}ms">${l}</span>`).join('')}</div>
     <div class="c-div r"></div>
     <div class="c-final r">${D.close.final}</div>`);
  close.insertAdjacentHTML('afterbegin','<div class="mesh-d"></div>');
  close.querySelector('.wrap').style.textAlign='center';
  root.appendChild(close);

  /* ACCORDION */
  root.addEventListener('click',e=>{const t=e.target.closest('.acc-trig');if(!t)return;
    const item=t.closest('.acc-item');const open=item.classList.contains('open');
    root.querySelectorAll('.acc-item.open').forEach(x=>{x.classList.remove('open');x.querySelector('.acc-trig').setAttribute('aria-expanded','false');});
    if(!open){item.classList.add('open');t.setAttribute('aria-expanded','true');}});

  /* REVEAL */
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{threshold:.1,rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.r,.rl').forEach(el=>io.observe(el));

  /* DOT NAV + PROGRESS */
  const secs=[...root.children];
  const nav=document.querySelector('.dot-nav');
  secs.forEach((s,i)=>{const a=document.createElement('a');a.href='#';a.addEventListener('click',ev=>{ev.preventDefault();s.scrollIntoView({behavior:'smooth'});});nav.appendChild(a);});
  const dots=[...nav.children];
  const bar=document.querySelector('.progress');
  const onScroll=()=>{const h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
    let cur=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=window.innerHeight*0.4)cur=i;});
    dots.forEach((d,i)=>d.classList.toggle('on',i===cur));};
  document.addEventListener('scroll',onScroll,{passive:true});onScroll();
})();

</script>
</body>
</html>
